name: Vircle
description: Vircle is a Malaysian family fintech platform, operated by Debit Circles
  Sdn Bhd, offering a parent app paired with a prepaid card for children so families
  can give pocket money, assign chores, and teach kids to earn, save, and spend responsibly.
  It issues a Visa Prepaid Card (Vircle Club) usable at Visa merchants worldwide and
  a School Card for cafeteria and campus e-store purchases, with real-time spend alerts
  and parental controls. Card issuance is provided in partnership with Fass Payment
  Solutions (Fasspay). Vircle is a portfolio company of 500 Global. As a consumer
  mobile app it publishes no public developer portal, API, or SDKs.
